<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr. Mendoza Health Center - Inventory Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="#">
        <span class="navbar-brand-logo">M</span> Mr. Mendoza Health Center - Inventory
      </a>
      <div class="d-flex align-items-center text-white ms-auto">
        <span class="me-3">Welcome, <strong id="user-display-name">Admin</strong></span>
        <button id="logout-btn" class="btn btn-outline-light btn-sm fw-bold">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4 mb-5">
    <div class="row">
      <main class="col-12 px-md-4">

        <div id="alertBanner" class="alert alert-warning border-0 shadow-sm d-none mb-4" role="alert">
          <div class="d-flex align-items-center">
            <i class="bi bi-exclamation-triangle-fill fs-4 me-3 text-warning"></i>
            <div>
              <strong>Low Stock Alert:</strong> <span id="alertMessage">Some products are at or below their reorder level.</span>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-4 border-bottom">
          <h1 class="h2 text-primary fw-bold" id="greeting">Dashboard Overview</h1>
          <button class="btn btn-success shadow-sm" id="exportCsvBtn">
            <i class="bi bi-file-earmark-spreadsheet me-1"></i> Export Inventory CSV
          </button>
        </div>

        <div class="row mb-4" id="chartsSection">
          <div class="col-md-6 mb-3">
            <div class="card stat-card-hover shadow-sm h-100">
              <div class="card-header bg-white py-3 fw-bold text-primary">
                Inventory Value by Category
              </div>
              <div class="card-body">
                <canvas id="inventoryBarChart"></canvas>
              </div>
            </div>
          </div>
          <div class="col-md-6 mb-3">
            <div class="card stat-card-hover shadow-sm h-100">
              <div class="card-header bg-white py-3 fw-bold text-primary">
                Stock Status Distribution
              </div>
              <div class="card-body">
                <canvas id="statusDoughnutChart"></canvas>
              </div>
            </div>
          </div>
        </div>

        <div class="card stat-card-hover shadow-sm mb-4" id="activity-section">
          <div class="card-header bg-white py-3 d-flex flex-wrap align-items-center justify-content-between">
            <h5 class="mb-0 text-primary fw-bold">Product Inventory Records</h5>
            <div class="small text-muted"><i class="bi bi-circle-fill text-success me-1"></i> Backend Sync Active</div>
          </div>
          <div class="card-body">

            <div class="row g-3 mb-3">
              <div class="col-md-3">
                <input type="text" id="searchInput" class="form-control" placeholder="Search by name or SKU...">
              </div>
              <div class="col-md-2">
                <select id="categoryFilter" class="form-select">
                  <option value="ALL">All Categories</option>
                  <option value="Antibiotics">Antibiotics</option>
                  <option value="Cardiovascular">Cardiovascular</option>
                  <option value="Analgesics">Analgesics</option>
                  <option value="Antidiabetic">Antidiabetic</option>
                  <option value="Gastrointestinal">Gastrointestinal</option>
                </select>
              </div>
              <div class="col-md-2">
                <select id="statusFilter" class="form-select">
                  <option value="ALL">All Statuses</option>
                  <option value="In Stock">In Stock</option>
                  <option value="Low Stock">Low Stock</option>
                  <option value="Out of Stock">Out of Stock</option>
                </select>
              </div>
              <div class="col-md-3">
                <div class="input-group">
                  <input type="number" id="minPriceInput" class="form-control" placeholder="Min ₱">
                  <input type="number" id="maxPriceInput" class="form-control" placeholder="Max ₱">
                </div>
              </div>
              <div class="col-md-2">
                <button class="btn btn-outline-secondary w-100" id="resetFiltersBtn">Reset</button>
              </div>
            </div>

            <div class="table-responsive">
              <table class="table table-striped table-custom-hover align-middle">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Product Name</th>
                    <th>SKU</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="inventoryTableBody">
                  <!-- Rendered dynamically -->
                </tbody>
              </table>
            </div>

          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/dataManager.js"></script>
  <script src="js/chartConfig.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
