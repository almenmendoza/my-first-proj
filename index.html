<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr. Mendoza Health Center - Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

  <div class="card stat-card-hover shadow-lg p-4 rounded-4" style="max-width: 400px; width: 100%;">
    <div class="text-center mb-4">
      <div class="navbar-brand-logo mx-auto mb-2" style="width: 50px; height: 50px; line-height: 50px; font-size: 1.5rem; background-color: #0d5c3e; color: #fff;">
        M
      </div>
      <h3 class="fw-bold text-primary mb-1">Mr. Mendoza</h3>
      <p class="text-muted small">Health Center Portal</p>
    </div>

    <div id="loginAlert" class="alert alert-danger d-none py-2 small" role="alert">
      Invalid username or password. Please try again.
    </div>

    <form id="loginForm">
      <div class="mb-3">
        <label for="username" class="form-label fw-bold small text-muted">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
          <input type="text" class="form-control" id="username" placeholder="Enter username" required>
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label fw-bold small text-muted">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input type="password" class="form-control" id="password" placeholder="Enter password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-custom-green w-100 py-2 fw-bold">Login</button>
    </form>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
