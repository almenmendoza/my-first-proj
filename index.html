<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr. Mendoza Health Center - Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

  <div class="container d-flex justify-content-center align-items-center">
    <div class="card stat-card-hover shadow-lg" style="max-width: 400px; width: 100%;">
      
      <div class="card-header bg-primary text-white text-center py-4">
        <h2 class="mb-0 fw-bold">Mr. Mendoza Health Center</h2>
        <p class="mb-0 small">Sign in to manage your healthcare dashboard</p>
      </div>

      <div class="card-body p-4">
        
        <div id="login-alert" class="alert alert-danger d-none" role="alert"></div>
           <form id="loginForm">
         <div class="mb-3">
        <label for="username" class="form-label">Username</label>
           <input type="text" class="form-control" id="username" placeholder="Enter username" required>
         </div>
  
           <div class="mb-3">
          <label for="password" class="form-label">Password</label>
           <input type="password" class="form-control" id="password" placeholder="Enter password" required>
            </div>

  <div id="feedback" class="d-none"></div>

  <button type="submit" id="loginBtn" class="btn btn-primary w-100 mt-3">Login</button>
</form>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
